[package]
name = "spyglass"
version = "0.3.2"
edition = "2024"
rust-version = "1.87"
description = "Read-only internet access for AI agents, built with security first"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
command-fds = "0.3.3"
dirs = "7.0.0"
dom_query = "0.28.0"
dom_smoothie = "0.18.2"
feed-rs = "3.0.0"
futures-util = "0.3.34"
htmd = "0.5.5"
keyring = "4.2.0"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "charset", "http2", "stream"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
