# cargo-deny: supply-chain policy. Run `cargo deny check`.
[advisories]
version = 2
yanked = "deny"
# Accepted risks. Each entry says why and when to revisit.
ignore = [
    # ttf-parser is unmaintained (no known vulnerability). It comes in via pdf-extract -> lopdf
    # (a required dependency) to read fonts embedded in PDFs. It is safe Rust, and spyglass
    # parses untrusted PDFs on a separate thread with a 30 s limit. Revisit when lopdf moves to
    # skrifa, or drop PDF support if a vulnerability is reported.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no known vulnerability; isolated PDF parsing" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC",
    "Unicode-3.0", "Zlib", "MPL-2.0", "Unlicense", "0BSD", "CC0-1.0", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
